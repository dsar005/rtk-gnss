seed: 42
sequence_length: 30
batch_size: 64
local_epochs: 2
rounds: 15
learning_rate: 0.001
fedprox_mu: 0.01
algorithm: fedavg          # fedavg or fedprox
train_fraction: 0.70
validation_fraction: 0.15
num_workers: 0

# Feature columns aligned with UrbanNav dataset conventions (ENU coordinates + IMU kinematics + GNSS metrics)
feature_columns:
  - gnss_e
  - gnss_n
  - gnss_u
  - gnss_speed
  - gnss_cn0
  - gnss_satellites
  - gnss_hdop
  - accel_x
  - accel_y
  - accel_z
  - gyro_x
  - gyro_y
  - gyro_z

# GNSS and Ground-truth coordinates in local East-North-Up (ENU) frame (meters)
gnss_position_columns: [gnss_e, gnss_n, gnss_u]
ground_truth_columns: [gt_e, gt_n, gt_u]

# Classification thresholds: <= high_threshold = High; <= medium_threshold = Medium; else Low.
high_threshold_m: 2.0
medium_threshold_m: 5.0

# Client datasets for UrbanNav urban canyon scenarios
clients:
  Medium_Urban_Canyon: data/sample/Medium_Urban_Canyon.csv
  Deep_Urban_Canyon: data/sample/Deep_Urban_Canyon.csv
  Harsh_Urban_Canyon: data/sample/Harsh_Urban_Canyon.csv
  Tunnel: data/sample/Tunnel.csv
